<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Localink - Mobile MVP</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css?v=localink-v3-flow-fix" />
  </head>
  <body>
    <main class="prototype-stage">
      <section id="app" class="phone" aria-live="polite"></section>
    </main>
    <script>
      window.addEventListener("error", (event) => {
        const app = document.querySelector("#app");
        if (app && !app.innerHTML) {
          app.innerHTML = `<div class="screen"><div class="screen-content"><div class="error-state"><strong>App startup error</strong><span>${event.message}</span></div></div></div>`;
        }
      });
    </script>
    <script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=localink-v3-flow-fix"></script>
    <script src="supabaseClient.js?v=localink-v3-flow-fix"></script>
    <script src="api.js?v=localink-v3-flow-fix"></script>
    <script src="data.js?v=localink-v3-flow-fix"></script>
    <script src="components.js?v=localink-v3-flow-fix"></script>
    <script src="map.js?v=localink-v3-flow-fix"></script>
    <script src="screens.js?v=localink-v3-flow-fix"></script>
    <script src="app.js?v=localink-v3-flow-fix"></script>
  </body>
</html>
