[build]
publish = "."

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
from = "/supabase/*"
to = "/index.html"
status = 404
force = true

[[redirects]]
from = "/DEPLOYMENT.md"
to = "/index.html"
status = 404
force = true

[[redirects]]
from = "/.env*"
to = "/index.html"
status = 404
force = true
